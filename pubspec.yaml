name: aura
description: "Aura - Modular, Cross-Platform Media Center Client."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Architecture
  flutter_bloc: ^9.1.1
  hydrated_bloc: ^11.0.0
  equatable: ^2.0.7

  # Routing
  go_router: ^18.0.1

  # High-Performance Playback Engine (libmpv wrapper)
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5

  # Networking & HTTP
  dio: ^5.8.0+1
  flutter_dotenv: ^6.0.1
  http: ^1.2.1

  # JSON Serialization & Functional Models
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Auth & Cloud Synchronization
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  google_sign_in: ^6.2.2
  supabase_flutter: ^2.8.4

  # Local Persistence & Security
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5

  # Utilities & UI
  uuid: ^4.5.1
  intl: ^0.20.2
  cached_network_image: ^4.0.0
  material_symbols_icons: ^4.2960.0
  google_fonts: ^8.2.1
  connectivity_plus: ^7.3.1
  battery_plus: ^7.1.1
  crypto: ^3.0.6
  rxdart: ^0.28.0
  youtube_explode_dart: ^3.1.0
  app_links: ^7.2.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  freezed: ^4.0.1
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - .env.example
    - assets/branding/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  macos:
    generate: true
  image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#141414"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
